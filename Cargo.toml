[package]
name = "altadra"
version = "0.1.0"
edition = "2024"
description = "A small Rust 2D game engine with a Lua-scriptable Windows scene editor"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
